version: '3'

tasks:
  default:
    cmds:
      - task --list-all
  lima:init:
    cmds:
      - limactl start --vm-type=krunkit --name=podman template://podman
      - limactl shell podman mkdir -p /home/totto2727.linux/.config/containers
      - limactl copy ./podman/registries.conf podman:/home/totto2727.linux/.config/containers/registries.conf
  lima:start:
    cmds:
      - limactl start podman --vm-type=krunkit
  agy:install:
    cmds:
      - jq -r '.[]' vscode/extensions.json | xargs -I {} agy --install-extension {}
  agy:update:
    cmds:
      - agy --list-extensions | jq -R -s 'split("\n") | map(select(length > 0))' > ./vscode/extensions.json